name: GPT Drive v0.6.3 Smart DNS + Quick Login

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-063.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.6.3 integration
        run: python3 ci/upgrade_063.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: GPTDrive-v0.6.3-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit tested v0.6.3 source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/gptdrive/app/ChatGptApiClient.java \
                  app/src/main/java/com/gptdrive/app/RemoteFileSource.java \
                  app/src/main/java/com/gptdrive/app/ExplorerActivityCompact.java \
                  app/src/main/java/com/gptdrive/app/MainActivity.java \
                  app/src/main/java/com/gptdrive/app/ChatGptAuthActivity.java \
                  app/src/main/java/com/gptdrive/app/DriveActions.java \
                  app/src/main/java/com/gptdrive/app/BrowserActivity.java \
                  app/src/main/AndroidManifest.xml \
                  app/build.gradle
          git commit -m "GPT Drive v0.6.3: quick login and OmniChat Smart DNS routing"
          git push origin HEAD:main
