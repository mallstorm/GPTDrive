name: Hotfix GPT Drive Library pagination

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hotfix-library-pagination.yml

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Library pagination hotfix
        run: python3 ci/hotfix_library_pagination.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build fixed APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: GPTDrive-v0.6.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit tested source hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/gptdrive/app/ChatGptApiClient.java \
                  app/src/main/java/com/gptdrive/app/BrowserActivity.java \
                  app/build.gradle
          git commit -m "GPT Drive v0.6.1: fix Library pagination HTTP 400"
          git push origin HEAD:main
